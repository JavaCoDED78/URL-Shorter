spring:
  lifecycle:
    # Bounds how long graceful shutdown (server.shutdown above) waits for
    # in-flight requests to finish before the JVM exits.
    timeout-per-shutdown-phase: 10s
  application:
    name: URL-Shorter
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      # Virtual threads raise request concurrency, but the pool stays the
      # explicit ceiling for PostgreSQL access (Task 14.3) — it must not be
      # scaled up just because threads became cheap.
      maximum-pool-size: 10
      # Bounds how long a request may wait for a connection (Task 18.1) —
      # a database outage degrades to a fast 503, never a hung request.
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  # Graceful shutdown (Spring Boot 3.3+/6.1): on SIGTERM the server stops
  # accepting new requests and waits (bounded below) for in-flight requests
  # to finish before the JVM exits - no dropped redirects on redeploy.
  shutdown: graceful

shortener:
  code:
    length: ${SHORTENER_CODE_LENGTH:7}
  url:
    max-length: ${SHORTENER_URL_MAX_LENGTH:2048}
    allowed-schemes: http,https
  alias:
    max-length: ${SHORTENER_ALIAS_MAX_LENGTH:64}
    reserved: api,actuator,swagger,swagger-ui,v3,favicon.ico,bench-hit
  create:
    max-collision-retries: ${SHORTENER_MAX_COLLISION_RETRIES:5}
  # Idempotency for the create endpoint (Idempotency-Key). A client that retries
  # a create after an HTTP timeout carries the same key; the store replays the
  # original 201 with the original code instead of creating a second link, so a
  # retry can no longer duplicate a link for the same URL. The key is hashed and
  # stored under idem:{sha256(key)} with this TTL.
  idempotency:
    ttl: ${SHORTENER_IDEMPOTENCY_TTL:24h}
    # How long a request whose key is owned by an in-flight request waits for the
    # winner to finish (a create finishes in milliseconds; this only guards
    # against a genuinely stuck owner, which then fails as 500).
    wait-timeout: ${SHORTENER_IDEMPOTENCY_WAIT_TIMEOUT:5s}
  cache:
    ttl: ${SHORTENER_CACHE_TTL:1h}
    # Symmetric TTL jitter (±jitter, default ±15%) about the base cache TTL (min(configured TTL,
    # remaining lifetime)). Spreads out the expiry of a mass of links created together (imports,
    # campaigns) so they do not all expire in the same second and stampede PostgreSQL.
    # Singleflight smooths that stampede but does not remove it — jitter keeps the expiries from
    # lining up in the first place. 0 disables jitter; [0, 0.5].
    jitter: ${SHORTENER_CACHE_JITTER:0.15}
    # Negative cache (Task 21.2): a short-lived marker on a code that did not exist,
    # so a scan of nonexistent codes stops hammering PostgreSQL. Short by design —
    # the trade-off is between shielding the database and missing a link created
    # during the gap (30–60s).
    negative-ttl: ${SHORTENER_CACHE_NEGATIVE_TTL:30s}
    # Bloom filter (Task 21.2): in-memory per replica, maintained on create.
    # Sized for `expected-codes` codes before reaching the target false-positive
    # rate. A distinct random code that was never created is absent from every
    # replica's filter, so the scan short-circuits locally without reaching the DB.
    expected-codes: ${SHORTENER_BLOOM_EXPECTED_CODES:1000000}
    bloom-false-positive-rate: ${SHORTENER_BLOOM_FALSE_POSITIVE_RATE:0.001}
  flush:
    interval: ${SHORTENER_FLUSH_INTERVAL:PT5S}
  # Raw JSON body ceiling (Task 20.1) — far above the largest legitimate
  # create request (2048-char URL plus JSON overhead).
  max-payload-size: ${SHORTENER_MAX_PAYLOAD_SIZE:16KB}
  # Maximum request-URI length (characters). A crafted path is parsed before
  # any handler runs and is not subject to the body/field limits, so this
  # bounds the request-line itself. Far above the largest legitimate code (11
  # chars); oversized paths answer 413 from RequestUriLengthFilter.
  max-uri-length: ${SHORTENER_MAX_URI_LENGTH:1024}
  # Benchmark-only /bench-hit redirect (Sprint 23 k6 harness). Disabled by
  # default: never part of the production API surface. The dev/benchmark
  # compose stack enables it explicitly.
  benchmark:
    enabled: ${SHORTENER_BENCHMARK_ENABLED:false}
  # Create-endpoint rate limiter (Task 20.4): client-scoped, fixed-window,
  # Redis-backed. Disabled by default so the existing suites (which fire
  # hundreds of concurrent creates) are unaffected; enable it in production
  # or a staging stack to protect the create endpoint from abuse. When
  # enabled, `RedisRateLimiter` protects `/api/v1/links`; a denied probe
  # answers 429.
  #
  # Scoping is per client, not per service: the counter key is the caller's
  # IP (see CreateIpRateLimitSource), so an abuser can only ever hit their own
  # ceiling — a single global counter would let one client block everyone.
  # `trusted-proxies` is an explicit allowlist (host or CIDR, e.g.
  # 10.0.0.0/8,172.16.0.5) of the proxies in front of the app. When the peer
  # is one of them, `X-Forwarded-For`'s first hop is the client; otherwise
  # the header is attacker-controlled and the remote address is used, so a
  # forged XFF can only masquerade as the local proxy.
  #
  # `fail-open` (default true): on a Redis outage the create path rides
  # through (availability-wins, like the redirect path). Set false to treat a
  # broken limiter as a refusal instead of an open door.
  rate-limiter:
    enabled: ${SHORTENER_RATE_LIMITER_ENABLED:false}
    window: ${SHORTENER_RATE_LIMITER_WINDOW:PT1M}
    max-requests: ${SHORTENER_RATE_LIMITER_MAX:100}
    fail-open: ${SHORTENER_RATE_LIMITER_FAIL_OPEN:true}
    trusted-proxies: ${SHORTENER_RATE_LIMITER_TRUSTED_PROXIES:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
  metrics:
    # Task 29.5: expose application timers (and the HTTP server timer) as
    # Prometheus histograms — without this, Micrometer exposes them as
    # summaries and `_bucket` series do not exist, so the recording rules'
    # histogram_quantile p50/p95/p99 (monitoring/prometheus/rules/
    # recording-rules.yml) and the dashboard latency panels (Task 29.9)
    # cannot be computed. This matches the observability contract, which
    # declares `*_seconds` bucket histograms for all timers.
    distribution:
      percentiles-histogram:
        urlshorter.redirectDuration: true
        urlshorter.postgresLookupDuration: true
        urlshorter.redisLookupDuration: true
        http.server.requests: true
