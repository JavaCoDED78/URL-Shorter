name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # one-shot CI runs gain nothing from a daemon
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests (pure JVM, no Docker required)
        run: ./gradlew test --tests '*Test'

  integration-tests:
    name: Full build + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Verify Docker is available for Testcontainers
        run: docker info >/dev/null
      - name: Clean build — integration tests run on real PostgreSQL/Redis
        run: ./gradlew clean build

  docker-image:
    name: Docker image + vulnerability scan
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t url-shorter:ci .
      - name: Vulnerability scan (Trivy, CRITICAL only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: url-shorter:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  monitoring-smoke:
    name: Monitoring stack smoke test
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: urlshortener
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build application (no Docker image needed)
        run: ./gradlew bootJar -x test
      - name: Start monitoring stack
        run: docker compose -f docker-compose.yml up -d postgres redis
      - name: Run application with monitoring
        run: |
          docker compose -f docker-compose.yml up -d app prometheus grafana
          # Wait for app to be healthy
          for i in $(seq 1 30); do
            if wget -qO- http://localhost:8080/actuator/health/readiness >/dev/null 2>&1; then
              echo "App healthy"
              break
            fi
            sleep 3
          done
          # Wait for Prometheus healthy
          for i in $(seq 1 10); do
            if wget -qO- http://localhost:9090/-/healthy >/dev/null 2>&1; then
              echo "Prometheus healthy"
              break
            fi
            sleep 3
          done
          # Wait for Grafana healthy
          for i in $(seq 1 10); do
            if wget -qO- http://localhost:14000/api/health >/dev/null 2>&1; then
              echo "Grafana healthy"
              break
            fi
            sleep 3
          done
      - name: Install Python for smoke tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run monitoring stack smoke tests
        run: python monitoring/validate-monitoring-stack.py
      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml down
