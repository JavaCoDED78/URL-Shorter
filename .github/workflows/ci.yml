name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # one-shot CI runs gain nothing from a daemon
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests (pure JVM — no Docker)
        run: ./gradlew unitTest

  integration-tests:
    name: Full build + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Verify Docker is available for Testcontainers
        run: docker info >/dev/null
      - name: Clean build — all tests run on real PostgreSQL/Redis
        run: ./gradlew clean build

  docker-image:
    name: Docker image + vulnerability scan
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build production image
        run: docker build -t url-shorter:ci .
      - name: Vulnerability scan (Trivy, CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: url-shorter:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  monitoring-smoke:
    name: Monitoring stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Use .env.example for compose defaults
        run: cp .env.example .env
      - name: Build application jar
        run: ./gradlew bootJar -x test
      - name: Install Python for smoke tests
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Validate monitoring configuration as code
        run: python monitoring/validate-monitoring-config.py
      - name: Start monitoring stack (compose reads .env)
        run: docker compose -f docker-compose.yml up -d postgres redis
      - name: Run application with monitoring
        run: |
          docker compose -f docker-compose.yml up -d app prometheus grafana
          # Wait for app to be healthy
          for i in $(seq 1 30); do
            if wget -qO- http://localhost:8080/actuator/health/readiness >/dev/null 2>&1; then
              echo "App healthy"
              break
            fi
            sleep 3
          done
          # Wait for Prometheus healthy
          for i in $(seq 1 10); do
            if wget -qO- http://localhost:9090/-/healthy >/dev/null 2>&1; then
              echo "Prometheus healthy"
              break
            fi
            sleep 3
          done
          # Wait for Grafana healthy
          for i in $(seq 1 10); do
            if wget -qO- http://localhost:14000/api/health >/dev/null 2>&1; then
              echo "Grafana healthy"
              break
            fi
            sleep 3
          done
      - name: Run monitoring stack smoke tests
        run: python monitoring/validate-monitoring-stack.py
      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml down
