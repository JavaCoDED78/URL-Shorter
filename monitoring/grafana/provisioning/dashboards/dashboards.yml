apiVersion: 1
providers:
  - name: url-shortener
    orgId: 1
    folder: URL Shortener
    type: file
    disableDeletion: false
    editable: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
      updateIntervalSeconds: 10
      allowUiUpdates: false
