# Production-like local stack: PostgreSQL + Redis.
# Credentials come from env (e.g. a git-ignored .env file).
# The defaults below are for local development only and must not be reused in real deployments.

services:
  postgres:
    image: postgres:17
    container_name: urlshorter-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urlshortener}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - urlshorter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-urlshortener}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: urlshorter-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - urlshorter
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  app:
    build: .
    container_name: urlshorter-app
    environment:
      # configuration through environment only — never baked into the image
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-urlshortener}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      # Task 21.4: health conditions, not just startup order — Flyway and
      # the cache must face ready infrastructure
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urlshorter
    healthcheck:
      # Task 21.2: readiness probe — the app answers traffic only after
      # Flyway and infrastructure are up
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  # ------------------------------------------------------------------- prometheus
  # Task 29.7: Prometheus scrapes /actuator/prometheus from the app.
  # Configuration (prometheus.yml + rules/*.yml) is mounted read-only
  # from the repository so the entire monitoring stack is defined in Git.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: urlshorter-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules/:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      app:
        condition: service_started
    networks:
      - urlshorter
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------- grafana
  # Task 29.8/29.10: Grafana auto-provisions datasource (Prometheus)
  # and imports the dashboard JSON from monitoring/grafana/dashboards/.
  grafana:
    image: grafana/grafana:11.4.0
    container_name: urlshorter-grafana
    ports:
      - "${GRAFANA_PORT:-14000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - urlshorter
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  urlshorter:
    driver: bridge
