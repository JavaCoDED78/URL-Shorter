# Development stack: PostgreSQL + Redis.
# Credentials and ports are read from .env (git-ignored).
# All defaults live in .env — edit there, never here.

services:
  postgres:
    image: postgres:17
    container_name: urlshorter-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    networks:
      - urlshorter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: urlshorter-redis-dev
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data-dev:/data
    networks:
      - urlshorter
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data-dev:
  redis-data-dev:

networks:
  urlshorter:
    driver: bridge
